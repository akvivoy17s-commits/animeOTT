name: anime_app

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^6.1.0
  file_picker: ^13.1.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_storage: ^13.0.2
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.6.0
  logging: ^1.3.0
  video_player: ^2.14.0
  webview_flutter: ^4.13.0

  google_sign_in_web: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/app_icon.jpeg"

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/google/google_logo.png